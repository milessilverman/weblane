name: Neighborhood ROI data refresh

on:
  push:
    branches: [claude/serene-cannon-exc9om]
    paths:
      - neighborhood-roi/pipeline/**
      - .github/workflows/neighborhood-data.yml
  workflow_dispatch:
    inputs:
      only_counties:
        description: "Comma-separated county FIPS to limit the run (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 9 3 * *" # monthly

permissions:
  contents: write

concurrency:
  group: neighborhood-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: neighborhood-roi/.cache
          key: nroi-cache-${{ github.run_id }}
          restore-keys: nroi-cache-
      - name: Install
        run: pip install geopandas pyogrio shapely pandas requests openpyxl
      - name: Build dataset
        env:
          ONLY_COUNTIES: ${{ github.event.inputs.only_counties }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python neighborhood-roi/pipeline/build_dataset.py
      - name: Commit outputs
        run: |
          git config user.name "neighborhood-roi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add neighborhood-roi/data/derived
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Refresh neighborhood data [skip ci]"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
