name: Neighborhood ROI data refresh

on:
  push:
    branches: [claude/serene-cannon-exc9om]
    paths:
      - neighborhood-roi/pipeline/**
      - .github/workflows/neighborhood-data.yml
  workflow_dispatch:
    inputs:
      only_counties:
        description: "Comma-separated county FIPS to limit the run (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 9 3 * *" # monthly

permissions:
  contents: write

concurrency:
  group: neighborhood-data
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        stage: [base, tes, fhfa, nri, places, walk, osm, schools, zillow, federal, bls]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: neighborhood-roi/pipeline/requirements.txt
      - uses: actions/cache@v4
        with:
          path: neighborhood-roi/.cache
          key: nroi-${{ matrix.stage }}-${{ github.run_id }}
          restore-keys: nroi-${{ matrix.stage }}-
      - run: pip install -r neighborhood-roi/pipeline/requirements.txt
      - if: matrix.stage == 'osm'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Run stage
        continue-on-error: true
        env:
          ONLY_COUNTIES: ${{ github.event.inputs.only_counties }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python -u neighborhood-roi/pipeline/build_dataset.py ${{ matrix.stage }}
      - uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.stage }}
          path: neighborhood-roi/data/derived/
          if-no-files-found: warn
          retention-days: 7

  merge:
    needs: stage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r neighborhood-roi/pipeline/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          path: neighborhood-roi/data/derived/
          merge-multiple: true
      - name: Merge
        run: python -u neighborhood-roi/pipeline/build_dataset.py merge
      - name: Commit outputs
        run: |
          rm -f neighborhood-roi/data/derived/status_*.json
          cp -r neighborhood-roi/data/derived "$RUNNER_TEMP/derived"
          git config user.name "neighborhood-roi-bot"
          git config user.email "actions@users.noreply.github.com"
          # generated files replace whatever is on the branch (never merged line by line)
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          rm -rf neighborhood-roi/data/derived
          cp -r "$RUNNER_TEMP/derived" neighborhood-roi/data/derived
          git add -A neighborhood-roi/data/derived
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Refresh neighborhood data [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
