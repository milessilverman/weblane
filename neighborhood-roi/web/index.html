  --park-line: #6ea869;
  --road: #ffffff;

  --fw: #e8c37a;

  --heat-0: #fde2d4; --heat-1: #f8c0a4; --heat-2: #f39b73; --heat-3: #eb6834; --heat-4: #c94f1f; --heat-5: #9d3a14; --heat-6: #6e270c;

  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;

}

  --ground: #0f1312; --sheet: #161b1a; --water: #0b1417;

  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --none: #262d2b;
  --good-ink: #0ca30c; --warn: #fab219;

html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 400 14px/1.5 var(--body); }

a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

<div class="app">
  <header class="bar">
    <div class="brand"><h1>Neighborhood ROI Map</h1><span>Home value created per $1 spent, by census tract</span></div>
    <div class="ctl"><label for="county">Area</label><select id="county"></select></div>
    <div class="ctl"><label for="metric">Color tracts by</label>
      <select id="metric">
        <option value="top_vpd">Best value per $1</option>
        <option value="top">Best improvement type</option>
        <option value="value">Home value</option>
        <option value="gap">Tree canopy gap</option>
        <option value="canopy">Tree canopy</option>
        <option value="heat">Heat vs. area average</option>
        <option value="park_m">Distance to a park</option>
        <option value="vacancy">Vacancy</option>
        <option value="school">Nearby school scores (CA)</option>
        <option value="growth10">10-yr ZIP price growth</option>
        <option value="walk">Walkability</option>
      </select></div>
    <div class="ctl grow"><label for="q">Find a neighborhood</label><input id="q" type="search" list="names" placeholder="Beverlywood, Carlson Park…" autocomplete="off"><datalist id="names"></datalist></div>
  </header>
  <div class="main">
    <div class="mapwrap"><div id="map" role="application" aria-label="Map of census tracts"></div><div class="legend" id="legend"></div></div>
    <aside class="panel" id="panel" aria-live="polite"><p class="empty">Loading tract data…</p></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt$ = v => v == null || isNaN(v) ? "–" : v >= 1e9 ? "$" + (v/1e9).toFixed(1) + "B" : v >= 1e6 ? "$" + (v/1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? "$" + Math.round(v/1e3) + "k" : "$" + Math.round(v);
const fmtN = v => v == null || isNaN(v) ? "–" : Math.round(v).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const GROUP = { street_tree: 1, community_garden: 1, pocket_park: 1, green_schoolyard: 1,
  vacant_lot_greening: 2, blight_demolition: 2, abandoned_house_fix: 2,
  street_lighting: 3, sidewalk_walkability: 3, protected_bikeway: 3, noise_barrier: 3, power_undergrounding: 3 };
const GROUP_NAME = { 1: "Greening: trees, gardens, parks, schoolyards", 2: "Blight: vacant lots, derelict buildings", 3: "Streets & safety: lighting, sidewalks, bikeways, noise" };
const METRICS = {
  top_vpd: { label: "Best value per $1", unit: v => "$" + v.toFixed(v < 10 ? 1 : 0), ramp: "seq", log: true },
  value: { label: "Home value (adjusted to today)", unit: fmt$, ramp: "seq" },
  gap: { label: "Canopy below Tree Equity goal", unit: v => v.toFixed(0) + " pts", ramp: "heat" },
  canopy: { label: "Tree canopy", unit: v => v.toFixed(0) + "%", ramp: "seq" },
  heat: { label: "Heat vs. area average", unit: v => (v > 0 ? "+" : "") + v.toFixed(1) + "°F", ramp: "heat" },
  park_m: { label: "Distance to nearest park", unit: v => v >= 1000 ? (v/1609).toFixed(1) + " mi" : Math.round(v) + " m", ramp: "seq" },
  vacancy: { label: "Vacant homes", unit: v => v.toFixed(0) + "%", ramp: "heat" },
  school: { label: "Nearby schools: % meeting standards", unit: v => v.toFixed(0) + "%", ramp: "seq" },
  growth10: { label: "10-yr ZIP home price growth", unit: v => "+" + v.toFixed(0) + "%", ramp: "seq" },
  walk: { label: "EPA walkability index (1–20)", unit: v => v.toFixed(1), ramp: "seq" },
};

let INDEX, map, tractLayer, ctxLayers = [], labelLayer, county, geo, details = {}, breaks = [], selected = null, selLayer = null;
const cache = {};

async function getJSON(p) { if (!cache[p]) cache[p] = fetch(p).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }); return cache[p]; }

function rampColors(kind) { return [0,1,2,3,4,5,6].map(i => css(`--${kind}-${i}`)); }

function computeBreaks(metric) {
  const vals = geo.features.map(f => f.properties[metric]).filter(v => v != null && !isNaN(v)).sort((a,b) => a-b);
  if (!vals.length) return [];
  const q = p => vals[Math.min(vals.length - 1, Math.floor(p * vals.length))];
  return [q(1/7), q(2/7), q(3/7), q(4/7), q(5/7), q(6/7)].map((v, i, a) => v);
}

function colorFor(p) {
  const m = $("#metric").value;
  if (m === "top") return p.top ? css(`--cat-${GROUP[p.top] || 3}`) : css("--none");
  const v = p[m];
  if (v == null || isNaN(v)) return css("--none");
  const cols = rampColors(METRICS[m].ramp);
  let i = 0; while (i < breaks.length && v > breaks[i]) i++;
  return cols[i];
}

function styleTract(f) {
  return { fillColor: colorFor(f.properties), fillOpacity: 0.78, color: css("--tract-line"), weight: 0.6 };
}

function drawLegend() {
  const m = $("#metric").value, el = $("#legend");
  if (m === "top") {
    el.innerHTML = `<h4>Best improvement type</h4><div class="cats">${[1,2,3].map(g => `<div><i style="background:${css(`--cat-${g}`)}"></i>${GROUP_NAME[g]}</div>`).join("")}<div><i style="background:${css("--none")}"></i>Not scored (few homes / no data)</div></div><div class="note">Click a tract for the full ranking.</div>`;
    return;
  }
  const meta = METRICS[m], cols = rampColors(meta.ramp);
  if (!breaks.length) { el.innerHTML = `<h4>${meta.label}</h4><div class="note">No data for this area yet.</div>`; return; }
  el.innerHTML = `<h4>${meta.label}</h4><div class="sw">${cols.map(c => `<i style="background:${c}"></i>`).join("")}</div>
    <div class="ends"><span>${meta.unit(breaks[0])}</span><span>${meta.unit(breaks[breaks.length-1])}</span></div>
    <div class="note">7 equal-count groups within ${esc(county.name)}. Gray = no data.</div>`;
}

function restyle(theme) { if (theme === true) drawContext(); breaks = $("#metric").value === "top" ? [] : computeBreaks($("#metric").value); tractLayer && tractLayer.setStyle(styleTract); drawLegend(); highlight(); }

function highlight() {
  if (selLayer) { selLayer.remove(); selLayer = null; }
  if (!selected) return;
  const f = geo.features.find(x => x.properties.GEOID === selected);
  if (f) selLayer = L.geoJSON(f, { interactive: false, style: { fill: false, color: css("--sel"), weight: 2.5 } }).addTo(map);
}

async function loadCounty(fips, focusGeoid) {
  county = INDEX.counties.find(c => c.fips === fips);
  $("#county").value = fips;
  [geo] = await Promise.all([getJSON(`data/tracts_${fips}.geojson`)]);
  const ctx = await getJSON(`data/context_${fips}.json`).catch(() => null);
  ctxLayers.forEach(l => l.remove()); ctxLayers = [];
  if (tractLayer) tractLayer.remove();
  breaks = computeBreaks($("#metric").value);
  tractLayer = L.geoJSON(geo, { style: styleTract, onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindTooltip(`<b>${esc(p.nb || "Tract " + p.GEOID.slice(5))}</b><br>${p.top_vpd != null ? "Best: $" + p.top_vpd.toFixed(1) + " per $1" : "Not scored"}`, { sticky: true, direction: "top" });
      l.on("click", () => selectTract(p.GEOID, false));
  } }).addTo(map);
  CTX = ctx; drawContext();
  drawLegend();
  const names = new Map();
  geo.features.forEach(f => (f.properties.nb || "").split(", ").filter(Boolean).forEach(n => { if (!names.has(n)) names.set(n, f.properties.GEOID); }));
  (INDEX.research?.neighborhoods || []).forEach(r => (r.tracts || []).forEach(t => { if (t.startsWith(fips) && !names.has(r.name)) names.set(r.name, t); }));
  window.NAME_TO_TRACT = names;
  $("#names").innerHTML = [...names.keys()].sort().map(n => `<option value="${esc(n)}">`).join("");
  if (focusGeoid) selectTract(focusGeoid, true);
  else { const b = county.bounds; map.fitBounds([[b[1], b[0]], [b[3], b[2]]]); }
}

let CTX = null;
function drawContext() {
  ctxLayers.forEach(l => l.remove()); ctxLayers = [];
  const ctx = CTX; if (!ctx) return;
  if (ctx.parks) ctxLayers.push(L.geoJSON(ctx.parks, { interactive: false, style: { fillColor: css("--park"), fillOpacity: .85, color: css("--park-line"), weight: .5 } }).addTo(map));
  if (ctx.roads) {
    const big = f => f.properties.k === "motorway";
    ctxLayers.push(L.geoJSON(ctx.roads, { interactive: false, style: f => ({ color: big(f) ? css("--fw-casing") : css("--road-casing"), weight: big(f) ? 4 : 2.2, opacity: .9 }) }).addTo(map));
    ctxLayers.push(L.geoJSON(ctx.roads, { interactive: false, style: f => ({ color: big(f) ? css("--fw") : css("--road"), weight: big(f) ? 2.4 : 1.1, opacity: 1 }) }).addTo(map));
  }
  labelLayer = L.layerGroup((ctx.labels || []).map(([n, lat, lon]) => L.marker([lat, lon], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: "", html: `<div class="nblabel">${esc(n)}</div>`, iconSize: null, iconAnchor: [0, 6] }) })));
  ctxLayers.push(labelLayer);
  updateLabels();
}

function updateLabels() { if (!labelLayer) return; const show = map.getZoom() >= 13; if (show && !map.hasLayer(labelLayer)) labelLayer.addTo(map); if (!show && map.hasLayer(labelLayer)) labelLayer.remove(); }

async function selectTract(geoid, fly) {
  selected = geoid; highlight();
  try { history.replaceState(null, "", "#t" + geoid); } catch (e) {}
  const f = geo.features.find(x => x.properties.GEOID === geoid);
  if (fly && f) map.fitBounds(L.geoJSON(f).getBounds(), { maxZoom: 14, padding: [60, 60] });
  $("#panel").innerHTML = `<p class="empty">Loading tract ${esc(geoid)}…</p>`;
  const d = (await getJSON(`data/details_${county.fips}.json`))[geoid];
  renderPanel(geoid, d, f?.properties || {});
}

function tile(k, v, s) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`; }

function spark(seriesObj, label) {
  if (!seriesObj) return "";
  const s = typeof seriesObj === "string" ? JSON.parse(seriesObj) : seriesObj;
  const pts = Object.entries(s).filter(([, v]) => v != null).map(([k, v]) => [+k, +v]);
  if (pts.length < 3) return "";
  const W = 400, H = 90, padL = 4, padR = 58, padT = 10, padB = 18;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) * 0.95, y1 = Math.max(...ys);
  const X = x => padL + (x - x0) / (x1 - x0) * (W - padL - padR), Y = y => padT + (1 - (y - y0) / (y1 - y0)) * (H - padT - padB);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" stroke="${css("--rule-strong")}" stroke-width="1"/>
    <path d="${d} L ${X(last[0])} ${H - padB} L ${X(x0)} ${H - padB} Z" fill="${css("--accent")}" fill-opacity=".12"/>
    <path d="${d}" fill="none" stroke="${css("--accent")}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="${css("--accent")}" stroke="${css("--sheet")}" stroke-width="2"/>
    <text x="${X(last[0]) + 8}" y="${Y(last[1]) + 4}" font-size="12" font-weight="600" fill="${css("--ink")}" font-family="IBM Plex Sans, system-ui">${label.startsWith("$") ? fmt$(last[1]) : last[1]}</text>
    <text x="${padL}" y="${H - 4}" font-size="10.5" fill="${css("--ink-3")}" font-family="IBM Plex Sans, system-ui">${x0}</text>
    <text x="${W - padR}" y="${H - 4}" font-size="10.5" text-anchor="end" fill="${css("--ink-3")}" font-family="IBM Plex Sans, system-ui">${x1}</text>
  </svg>`;
}

function renderPanel(geoid, d, p) {
  if (!d) { $("#panel").innerHTML = `<p class="empty">No details for tract ${esc(geoid)}.</p>`; return; }
  const m = d.metrics, recs = d.recs || [];
  const research = (INDEX.research?.neighborhoods || []).filter(r => (r.tracts || []).includes(geoid));
  const tractName = "Census tract " + (+geoid.slice(5, 9)) + (geoid.slice(9) !== "00" ? "." + geoid.slice(9) : "");
  const nb = research.length ? research.map(r => r.name).join(" · ") : d.neighborhoods?.length ? d.neighborhoods.slice(0, 3).join(" · ") : tractName;
  const top = recs[0];
  const maxV = Math.max(...recs.map(r => r.vpd), 1);
  const canopyGoal = m.canopy_goal_pct > 0 ? ` (goal ${Math.round(m.canopy_goal_pct)}%)` : "";
  let h = `<div class="eyebrow">${esc(tractName.toUpperCase())} · ${geoid} · ${esc(county.name)}</div><h2>${esc(nb)}</h2>`;
  h += top ? `<p class="verdict">Best bet here: <b>${esc(top.name.toLowerCase())}</b>, about <b>$${top.vpd.toFixed(top.vpd < 10 ? 2 : 1)}</b> of nearby home value per $1 spent.</p>`
           : `<p class="verdict">Too few homes or too little data to rank improvements here.</p>`;
  h += `<div class="tiles">
    ${tile("Typical home value", fmt$(p.value), m.median_home_value ? "ACS " + fmt$(m.median_home_value) + ", adj. by Zillow" : "")}
    ${tile("Homes", fmtN(m.housing_units), m.owner_units && m.occupied_units ? Math.round(100 * m.owner_units / m.occupied_units) + "% owner-occupied" : "")}
    ${m.canopy_pct != null && m.canopy_pct >= 0 ? tile("Tree canopy", Math.round(m.canopy_pct) + "%", canopyGoal)
      : tile("Canopy gap", m.canopy_gap_pct != null ? Math.round(m.canopy_gap_pct) + " pts" : "–", m.canopy_gap_pct != null ? "below Tree Equity goal" : "")}
    ${tile("Heat", m.temp_diff_f != null ? (m.temp_diff_f > 0 ? "+" : "") + (+m.temp_diff_f).toFixed(1) + "°F" : "–", "vs. area average")}
    ${tile("Nearest park", m.nearest_park_m != null ? (m.nearest_park_m >= 1000 ? (m.nearest_park_m / 1609).toFixed(1) + " mi" : Math.round(m.nearest_park_m) + " m") : "–", esc(m.nearest_park_name || ""))}
    ${tile("Nearby schools", m.school_ela_pct_met_near3 != null ? Math.round(m.school_ela_pct_met_near3) + "% ELA" : "–", m.school_math_pct_met_near3 != null ? Math.round(m.school_math_pct_met_near3) + "% math meet standards" : "CA only for now")}
  </div>`;

  h += `<div class="section"><h3>Improvements ranked by value per $1</h3>`;
  if (!recs.length) h += `<p class="empty">Nothing scored for this tract.</p>`;
  h += `<div class="recs">${recs.map((r, i) => `<div class="rec${i === 0 ? " top" : ""}">
    <div class="row1"><span class="nm">${esc(r.name)}</span><span class="vpd">$${r.vpd.toFixed(r.vpd < 10 ? 2 : 1)} / $1</span></div>
    <div class="bar"><i style="width:${Math.max(2, 100 * Math.log1p(r.vpd) / Math.log1p(maxV)).toFixed(1)}%"></i></div>
    <div class="meta">${esc(r.project)} · costs ~${fmt$(r.cost)} · adds ~${fmt$(r.value)} across ~${fmtN(r.homes)} homes<span class="chip${/^strong/.test(r.evidence) ? " strong" : ""}">${esc(r.evidence.split(" (")[0])} evidence</span></div>
    <details><summary>Why here, and the math</summary>
      <p class="small"><b>Fit ${Math.round(r.fit * 100)}%:</b> ${esc(r.why)}</p>
      <div class="math">value = ${fmtN(r.homes)} homes × ${fmt$(p.value)} × ${r.uplift_pct}% uplift${r.id === "street_tree" ? "" : " × ⅓ distance decay"} × ${Math.round(r.fit * 100)}% fit × ramp-up<br>
      cost = ${fmt$(r.capex)} build${r.land ? " + " + fmt$(r.land) + " land" : ""} + ${fmt$(r.maint_pv)} upkeep (10-yr PV)<br>
      cost factor ${county.cost_factor} (${esc(county.cost_source)})</div>
      <p class="small"><b>Evidence:</b> ${esc(r.basis)}</p>
      <p class="src muted">Sources: ${esc(r.sources)}</p>
    </details></div>`).join("")}</div>
    <p class="small muted">Value created goes mostly to surrounding owners; it counts all nearby homes. Effects use the low end of published studies.</p></div>`;

  research.forEach(r => {
    h += `<div class="section"><h3>Local notes: ${esc(r.name)}</h3><ul class="facts">${r.facts.map(f => `<li>${esc(f.text)} <a class="src" href="${esc(f.source)}" target="_blank" rel="noopener">source</a></li>`).join("")}</ul>`;
    if (r.current_projects?.length) h += `<h3 style="margin-top:14px">Happening now</h3><ul class="facts">${r.current_projects.map(c => `<li><b>${esc(c.name)}.</b> ${esc(c.detail)} <a class="src" href="${esc(c.source)}" target="_blank" rel="noopener">source</a></li>`).join("")}</ul>`;
    if (r.local_angles?.length) h += `<h3 style="margin-top:14px">What that means for spending</h3><ul class="facts">${r.local_angles.map(a => `<li>${esc(a)}</li>`).join("")}</ul>`;
    h += `</div>`;
  });

  const zs = m.zip_zhvi_series;
  if (zs || m.hpi_series) {
    h += `<div class="section"><h3>Home prices${m.zip ? " · ZIP " + esc(m.zip) : ""}</h3>`;
    if (zs) h += spark(zs, "$ Zillow typical home value by year");
    h += `<div class="kv">`;
    [["1-yr change (Zillow ZIP)", m.zip_zhvi_growth_1y_pct], ["5-yr change (Zillow ZIP)", m.zip_zhvi_growth_5y_pct], ["10-yr change (Zillow ZIP)", m.zip_zhvi_growth_10y_pct],
     ["5-yr change (FHFA, this tract)", m.hpi_growth_5y_pct], ["10-yr change (FHFA, this tract)", m.hpi_growth_10y_pct], ["20-yr change (FHFA, this tract)", m.hpi_growth_20y_pct]]
      .filter(([, v]) => v != null).forEach(([k, v]) => h += `<span>${k}</span><span>${v > 0 ? "+" : ""}${(+v).toFixed(1)}%</span>`);
    h += `</div></div>`;
  }

  const nearSchools = m.schools_near3 ? JSON.parse(m.schools_near3) : [];
  if (nearSchools.length) h += `<div class="section"><h3>Closest scored public schools (CAASPP)</h3><div class="kv">${nearSchools.map(s => `<span>${esc(s.name)} <span class="muted">· ${(s.dist_m / 1609).toFixed(1)} mi</span></span><span>${s.ela ?? "–"}% / ${s.math ?? "–"}%</span>`).join("")}</div><p class="small muted">% meeting standards, ELA / math.</p></div>`;

  const kv = [];
  const add = (k, v, f = x => x) => { if (v != null && v !== "" && !(typeof v === "number" && isNaN(v))) kv.push(`<span>${k}</span><span>${f(v)}</span>`); };
  add("Population", m.population, fmtN); add("Median household income", m.median_household_income, fmt$);
  add("Median rent", m.median_gross_rent, v => "$" + fmtN(v)); add("Median year built", m.median_year_built, v => Math.round(v));
  add("Vacant homes", m.vacant_units && m.housing_units ? 100 * m.vacant_units / m.housing_units : null, v => v.toFixed(1) + "%");
  add("Commute by transit", m.commuters_transit && m.commuters ? 100 * m.commuters_transit / m.commuters : null, v => v.toFixed(0) + "%");
  add("Park acres within ½ mile", m.park_acres_within_half_mile, v => (+v).toFixed(1));
  add("Nearest rail station", m.nearest_rail_station_m, v => (v / 1609).toFixed(1) + " mi" + (m.nearest_rail_station_name ? " · " + esc(m.nearest_rail_station_name) : ""));
  add("Nearest freeway", m.nearest_freeway_m, v => Math.round(v) + " m");
  add("Walkability (EPA, 1–20)", m.walk_index, v => (+v).toFixed(1));
  add("FEMA overall risk", m.nri_risk_rating);
  add("Heat-wave risk score", m.nri_heatwave_risk, v => (+v).toFixed(0));
  add("Poor mental health (adults)", m.poor_mental_health_pct, v => v + "%");
  add("Asthma (adults)", m.asthma_pct, v => v + "%");
  if (kv.length) h += `<div class="section"><h3>Tract profile</h3><div class="kv">${kv.join("")}</div></div>`;

  const fed = (county.federal || []).filter(x => !m.zip || x.zip === m.zip).slice(0, 6);
  const fedAll = county.federal || [];
  if (fedAll.length) h += `<div class="section"><h3>Federal grants for parks, trees, trails & streets</h3>${fed.length ? `<p class="small">In ZIP ${esc(m.zip)}:</p>` : `<p class="small">None tagged to this ZIP. Largest in ${esc(county.name)}:</p>`}
    <ul class="facts">${(fed.length ? fed : fedAll.slice(0, 5)).map(x => `<li><b>${fmt$(x.amount)}</b> · ${esc(x.recipient)}: ${esc((x.desc || "").slice(0, 140))}${x.desc && x.desc.length > 140 ? "…" : ""} <span class="muted">(${esc(x.agency)}, ${esc(x.start)})</span></li>`).join("")}</ul></div>`;

  const fund = INDEX.research?.funding_landscape || [];
  if (fund.length) h += `<div class="section"><h3>Funding climate</h3><ul class="facts">${fund.map(f => `<li><b>${esc(f.name)}.</b> ${esc(f.detail)} <a class="src" href="${esc(f.source)}" target="_blank" rel="noopener">source</a></li>`).join("")}</ul></div>`;

  h += `<div class="section"><h3>Data</h3><p class="small muted">Census ACS 5-yr · Tree Equity Score (American Forests) · Zillow ZHVI · FHFA tract HPI · FEMA National Risk Index · CDC PLACES · EPA Walkability Index · CA Dept. of Education & CAASPP · USAspending.gov · BLS OEWS · © OpenStreetMap contributors. Refreshed monthly by the pipeline.</p></div>`;
  $("#panel").innerHTML = h;
  $("#panel").scrollTop = 0;
}

async function init() {
  map = L.map("map", { preferCanvas: true, zoomSnap: 0.5, minZoom: 8, attributionControl: true });
  map.attributionControl.setPrefix(false).addAttribution("Census · American Forests · Zillow · FHFA · FEMA · CDC · © OpenStreetMap contributors");
  map.on("zoomend", updateLabels);
  INDEX = await getJSON("data/index.json");
  $("#county").innerHTML = INDEX.counties.map(c => `<option value="${c.fips}">${esc(c.name)} (${c.tracts.toLocaleString()} tracts)</option>`).join("");
  $("#county").onchange = e => { selected = null; loadCounty(e.target.value); };
  $("#metric").onchange = () => restyle(false);
  $("#q").onchange = e => { const g = window.NAME_TO_TRACT?.get(e.target.value); if (g) selectTract(g, true); };
  const h = location.hash.match(/^#t(\d{11})$/);
  const startGeoid = h ? h[1] : (INDEX.default_tract || null);
  const fips = startGeoid ? startGeoid.slice(0, 5) : INDEX.counties[0].fips;
  await loadCounty(fips, startGeoid);
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => restyle(true));
  new MutationObserver(() => restyle(true)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}
init().catch(e => { $("#panel").innerHTML = `<p class="empty">Could not load the map data (${esc(e.message)}).</p>`; });
</script>
