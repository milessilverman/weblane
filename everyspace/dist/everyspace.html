<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Everyspace</title>
  <meta name="description" content="Rent out any part of your place: a backyard for a night, a parking spot for the fair, a garage bay, a roof for solar.">

  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%232f6f4f%22%2F%3E%3Cpath%20d%3D%22M116%20262%20L256%20142%20L396%20262%20V384%20H116%20Z%22%20fill%3D%22%23f7f6f2%22%2F%3E%3Crect%20x%3D%22146%22%20y%3D%22282%22%20width%3D%22100%22%20height%3D%22102%22%20fill%3D%22%239fcf8a%22%2F%3E%3Crect%20x%3D%22270%22%20y%3D%22282%22%20width%3D%2296%22%20height%3D%2246%22%20fill%3D%22%23ffd25e%22%2F%3E%3Crect%20x%3D%22270%22%20y%3D%22338%22%20width%3D%2296%22%20height%3D%2246%22%20fill%3D%22%23e8835a%22%2F%3E%3C%2Fsvg%3E%0A">
  <style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --panel-2: #f1f0ea; --ink: #1d1f1c; --muted: #6b6f68; --line: #e4e2db;
  --accent: #2f6f4f; --accent-ink: #ffffff; --accent-soft: #e3efe8;
  --warn: #9a5b0c; --warn-soft: #fbf0dc; --bad: #b3401f; --bad-soft: #fbe6df; --ok: #2f6f4f; --ok-soft: #e3efe8;
  --event: #6b3fb0; --event-soft: #efe8fb; --star: #d39b16;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
  --nav-h: 64px; --safe-b: env(safe-area-inset-bottom, 0px);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --panel: #1b1e1a; --panel-2: #23271f; --ink: #ecede8; --muted: #9da197; --line: #30352d;
    --accent: #7cc39b; --accent-ink: #0f1510; --accent-soft: #23362b;
    --warn: #f0b860; --warn-soft: #3a2f1c; --bad: #f19a7c; --bad-soft: #3b231b; --ok: #7cc39b; --ok-soft: #23362b;
    --event: #c3a5f5; --event-soft: #2e2541; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --panel: #1b1e1a; --panel-2: #23271f; --ink: #ecede8; --muted: #9da197; --line: #30352d;
  --accent: #7cc39b; --accent-ink: #0f1510; --accent-soft: #23362b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; }
svg { stroke-linecap: round; stroke-linejoin: round; }
h1, h2, h3 { line-height: 1.2; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.fine { text-align: center; margin: 18px 0; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* ---------- shell ---------- */
.view { min-height: 100vh; padding-bottom: 96px; }
.view.with-nav { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px); }
.view.chat-view { padding-bottom: 80px; }
.splash { display: grid; place-items: center; min-height: 80vh; }
.page { max-width: 1120px; margin: 0 auto; padding: 8px 16px 16px; }
.page.narrow { max-width: 680px; }
.brand { font-size: 22px; font-weight: 500; letter-spacing: -.02em; color: var(--accent); }
.brand b { font-weight: 800; }

.topbar { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
  padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); }
.topbar h1 { margin: 0; font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; justify-content: flex-end; }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; padding: 0; }
.icon-btn:hover { background: var(--panel-2); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.icon-btn svg, .tabbar svg, .menu svg, .list-row > svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.icon-btn.floating { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; background: var(--panel); box-shadow: var(--shadow); }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px;
  height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.tabbar a { flex: 0 1 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.tabbar a.on { color: var(--accent); font-weight: 600; }
.tabbar a.on svg { stroke-width: 2.2; }

/* ---------- buttons, chips, badges ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 12px 18px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.link { background: transparent; color: var(--accent); }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.wide { width: 100%; margin: 8px 0; }
.btn.danger-ghost { background: transparent; color: var(--bad); border: 1px solid var(--bad-soft); }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.stack { display: grid; gap: 8px; margin-top: 16px; }

.chips { display: flex; gap: 8px; }
.chips.scroll { overflow-x: auto; scrollbar-width: none; padding: 2px 16px; margin: 0 -16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.chip.small { padding: 6px 11px; font-size: 13px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.event { background: var(--event-soft); color: var(--event); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 11px; background: var(--bad); color: #fff; font-size: 12px; padding: 0 6px; }
.stars { font-size: 13px; white-space: nowrap; }
.stars.new { color: var(--muted); }
.avatar { display: inline-grid; place-items: center; flex: none; width: var(--size); height: var(--size); border-radius: 50%; color: #fff; font-weight: 700; font-size: calc(var(--size) * .42); }

/* ---------- explore ---------- */
.explore-head { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px);
  padding: max(10px, env(safe-area-inset-top)) 16px 10px; display: grid; gap: 10px; max-width: 1120px; margin: 0 auto; }
.brand-row { display: flex; justify-content: space-between; align-items: center; }
.searchbar { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); }
.searchbar svg { width: 20px; height: 20px; fill: none; stroke: var(--muted); stroke-width: 2; flex: none; }
.searchbar input { border: 0; box-shadow: none; background: transparent; padding: 8px 4px; }
.when-row { display: flex; gap: 8px; }
.when { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
.when svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.when.set { border-color: var(--ink); font-weight: 600; }
.explore-body { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.section-title { font-size: 18px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px 16px; }
.card { display: block; background: var(--panel); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.card.pad { padding: 14px; }
.card-body { padding: 10px 12px 12px; display: grid; gap: 2px; }
.card .title { font-size: 15px; line-height: 1.3; }
.space-card { border: 0; background: transparent; }
.space-card .card-body { padding: 8px 2px 0; }
.thumb { position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 3 / 2; background: var(--panel-2); }
.art { display: block; width: 100%; height: 100%; }
.cat-tag { position: absolute; left: 8px; top: 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
.price { font-weight: 700; }
.price span { font-weight: 400; color: var(--muted); font-size: 13px; }
.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 300px); gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 6px; margin: 0 -16px; scroll-snap-type: x mandatory; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; }
.event-card { display: flex; gap: 12px; padding: 12px; align-items: center; }
.event-date { display: grid; place-items: center; flex: none; width: 58px; height: 62px; border-radius: 12px; background: var(--event-soft); color: var(--event); }
.event-date span { font-size: 12px; text-transform: uppercase; font-weight: 600; }
.event-date b { font-size: 18px; }
.pkg-card .pkg-art { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; height: 140px; gap: 2px; }
.pkg-card .pkg-art > div:first-child { grid-row: span 2; }
.pkg-card .pkg-art.n1 > div { grid-column: span 2; }
.pkg-card .pkg-art.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.pkg-card .pkg-art.n2 > div:first-child { grid-row: auto; }
.mini-card .art { height: 120px; }
.host-cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 4px; padding: 16px; border-radius: var(--radius);
  background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #d39b16)); color: var(--accent-ink); }
.host-cta strong { display: block; font-size: 16px; }
.host-cta span { font-size: 13px; opacity: .9; }
.cta-btn { flex: none; background: var(--accent-ink); color: var(--accent) !important; opacity: 1 !important; font-weight: 700; padding: 8px 14px; border-radius: 10px; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty-icon { font-size: 42px; }
.skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; }
.skeleton { height: 220px; border-radius: var(--radius); background: linear-gradient(90deg, var(--panel-2), var(--panel), var(--panel-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
.skeleton.line { height: 18px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* map */
.map-wrap { position: relative; margin-top: 8px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.map { display: block; width: 100%; height: min(68vh, 620px); background: #e9eee4; }
.map .land { fill: #eef1e8; } .map .water { fill: #b9dcf2; } .map .park { fill: #cfe5c4; }
.map .street { stroke: #fff; stroke-width: 5; } .map .street.major { stroke: #f8e7b7; stroke-width: 9; }
.map-label { font-size: 11px; fill: #6b7a66; font-weight: 600; }
.pin { cursor: pointer; outline: none; }
.pin:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
.pin rect { fill: var(--panel); stroke: var(--line); filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.pin path { fill: var(--panel); }
.pin text { font-size: 12px; font-weight: 700; text-anchor: middle; fill: var(--ink); }
.pin.on rect, .pin.on path { fill: var(--ink); } .pin.on text { fill: var(--bg); }
.pin .pin-count { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.pin text.pin-count-text { font-size: 11px; fill: var(--accent-ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map { filter: brightness(.75) contrast(1.05); } }
.map-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: color-mix(in srgb, var(--panel) 96%, transparent); border-top: 1px solid var(--line); }
.map-panel .hscroll { grid-auto-columns: 220px; margin-top: 8px; }
.map-panel .thumb { aspect-ratio: 16 / 9; }

/* ---------- detail ---------- */
.hero { position: relative; max-width: 1120px; margin: 0 auto; }
.hero-art { height: min(46vh, 380px); }
.hero.short .hero-art { height: 180px; }
@media (min-width: 760px) { .hero { padding: 12px 16px 0; } .hero-art { border-radius: 20px; } .icon-btn.floating { top: 24px; left: 28px; } }
.page-title { font-size: 26px; margin: 6px 0; letter-spacing: -.01em; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.notice { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.event { background: var(--event-soft); color: var(--event); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.host-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 14px 0; }
.host-row > div { flex: 1; }
.block .host-row { border: 0; margin: 0; padding: 0; }
.amenities { display: flex; flex-wrap: wrap; gap: 8px; }
.amenities span { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.rate-table { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rate-table > div { display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.rate-table > div:last-child { border-bottom: 0; }
.rate-table > div.ok { background: var(--ok-soft); }
.list-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-row > div { flex: 1; min-width: 0; }
.list-row .art.mini, .art.mini { width: 56px; height: 56px; border-radius: 10px; flex: none; }
.list-row.link > svg { color: var(--muted); }
.pkg-icon, .pay-icon { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 10px; background: var(--panel-2); font-size: 24px; flex: none; }
.pay-icon { width: 44px; height: 44px; font-size: 20px; }
.facts { display: grid; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.facts > div { display: grid; gap: 2px; padding: 12px 14px; background: var(--panel); }
.facts span { color: var(--muted); font-size: 14px; }
.reviews { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.review { display: flex; gap: 10px; }
.review p { margin: 4px 0 0; font-size: 14px; }
.stars-line { color: var(--star); font-size: 13px; letter-spacing: 1px; }

.reserve-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 12px 16px calc(12px + var(--safe-b)); background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.05); }
@media (min-width: 760px) { .reserve-bar { left: 50%; transform: translateX(-50%); width: min(680px, calc(100% - 32px)); bottom: 16px; border-radius: 18px; border: 1px solid var(--line); } }

/* calendar */
.cal { position: relative; }
.cal-nav { position: absolute; right: 0; top: -4px; display: flex; gap: 4px; }
.cal-months { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.cal-title { font-weight: 700; margin: 6px 0 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-grid .dow { font-size: 11px; color: var(--muted); padding: 4px 0; }
.day { position: relative; aspect-ratio: 1; border: 0; background: transparent; border-radius: 50%; cursor: pointer; font-size: 14px; max-height: 44px; }
.day:hover:not(:disabled) { outline: 1px solid var(--ink); }
.day:disabled { cursor: default; }
.day.past { color: var(--muted); opacity: .4; }
.day.full { color: var(--muted); text-decoration: line-through; }
.day.partial::after, .day:not(.past):not(.full):not(.partial)::after { content: ''; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ok); }
.day.partial::after { background: var(--warn); }
.day.past::after { display: none; }
.day.range { background: var(--accent-soft); border-radius: 0; }
.day.sel { background: var(--ink); color: var(--bg); }
.cal-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.cal-legend .free { background: var(--ok); } .cal-legend .partial { background: var(--warn); } .cal-legend .full { background: var(--line); }

/* ---------- checkout ---------- */
.summary-card { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin: 8px 0 4px; }
.thumb-sm { width: 96px; height: 72px; border-radius: 10px; flex: none; }
.block { padding: 18px 0; border-bottom: 1px solid var(--line); }
.block h2 { font-size: 17px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
.block h2 svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
.block.row-between h2 { margin: 0; }
.segmented { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border-radius: 12px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.segmented button { flex: 1 0 auto; border: 0; background: transparent; border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }

// Time helpers. All times are UTC; intervals are half-open [start, end).

const HOUR = 3_600_000;
const DAY = 24 * HOUR;

function toMs(value) {
  const ms = typeof value === 'number' ? value : Date.parse(value);
  if (Number.isNaN(ms)) throw new Error(`Invalid date: ${value}`);
  return ms;
}

function overlaps(aStart, aEnd, bStart, bEnd) {
  return toMs(aStart) < toMs(bEnd) && toMs(bStart) < toMs(aEnd);
}

function addMonths(ms, n) {
  const d = new Date(ms);
  const day = d.getUTCDate();
  const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1,
    d.getUTCHours(), d.getUTCMinutes()));
  const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  target.setUTCDate(Math.min(day, lastDay));
  return target.getTime();
}

// Whole months from start to end, plus leftover days.
function monthsBetween(start, end) {
  const s = toMs(start), e = toMs(end);
  let months = 0;
  while (addMonths(s, months + 1) <= e) months++;
  const extraDays = Math.round((e - addMonths(s, months)) / DAY);
  return { months, extraDays };
}

(() => {
// Host dashboard numbers and the per-day availability calendar.
const { unitsFree } = __m['availability'];
const { effectiveStatus } = __m['social'];
const { addMonths, DAY, toMs } = __m['time'];
const { SERVICE_FEE, HOST_FEE } = __m['pricing'];

const EARNING = new Set(['confirmed', 'active', 'completed']);
const NEEDS_HOST = new Set(['pending', 'proposed', 'site_assessment', 'contract']);
const monthKey = (ms) => new Date(ms).toISOString().slice(0, 7);
const money = (n) => Math.round(n * 100) / 100;

// When the host gets paid for a booking: [{ month: 'YYYY-MM', amount }]
function payoutSchedule(b) {
  const q = b.quote;
  if (!q) return [];
  const s = toMs(b.start), e = toMs(b.end);
  if (q.schedule?.recurring) {
    const perPeriod = (q.schedule.recurring / (1 + SERVICE_FEE)) * (1 - HOST_FEE);
    const step = b.term === 'infrastructure' ? 12 : 1;
    const out = [];
    for (let t = s; t < e; t = addMonths(t, step)) out.push({ month: monthKey(t), amount: money(perPeriod) });
    return out;
  }
  return [{ month: monthKey(s), amount: q.hostPayout ?? money(q.rent * (1 - HOST_FEE)) }];
}

function hostSummary(db, hostId, now = Date.now()) {
  const nowMs = toMs(now);
  const mine = db.bookings.filter((b) => b.hostId === hostId);
  const label = (b) => db.packages.find((p) => p.id === b.packageId)?.name
    ?? b.items.map((i) => `${i.qty > 1 ? `${i.qty}× ` : ''}${db.spaces.find((s) => s.id === i.spaceId)?.title}`).join(' + ');
  const withNames = (b) => {
    const first = db.spaces.find((s) => s.id === b.items[0].spaceId);
    return { ...b, effective: effectiveStatus(b, nowMs), itemsLabel: label(b), primary: { id: first?.id, category: first?.category, title: first?.title },
      renterName: db.users.find((u) => u.id === b.renterId)?.name };
  };

  // Earnings by month, from 3 months ago to 8 months ahead.
  const months = [];
  for (let i = -3; i <= 8; i++) months.push(monthKey(addMonths(Date.UTC(new Date(nowMs).getUTCFullYear(), new Date(nowMs).getUTCMonth(), 1), i)));
  const byMonth = Object.fromEntries(months.map((m) => [m, 0]));
  const perSpace = {};
  let allTime = 0;
  for (const b of mine.filter((x) => EARNING.has(x.status))) {
    const schedule = payoutSchedule(b);
    const lineSum = b.quote.lines.reduce((s, l) => s + l.amount, 0) || 1;
    for (const p of schedule) {
      if (p.month in byMonth) byMonth[p.month] = money(byMonth[p.month] + p.amount);
      allTime += p.amount;
      for (const l of b.quote.lines) perSpace[l.spaceId] = money((perSpace[l.spaceId] ?? 0) + (p.amount * l.amount) / lineSum);
    }
  }
  const thisMonth = monthKey(nowMs);
  const next6 = months.filter((m) => m > thisMonth).slice(0, 6).reduce((s, m) => s + byMonth[m], 0);

  const spaces = db.spaces.filter((s) => db.properties.find((p) => p.id === s.propertyId)?.hostId === hostId && s.rentable !== false);
  return {
    needsAction: mine.filter((b) => NEEDS_HOST.has(b.status)).map(withNames).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)),
    upcoming: mine.filter((b) => b.status === 'confirmed' && toMs(b.start) > nowMs && toMs(b.start) - nowMs < 45 * DAY)
      .map(withNames).sort((a, b) => (a.start < b.start ? -1 : 1)),
    active: mine.filter((b) => effectiveStatus(b, nowMs) === 'active').map(withNames),
    earnings: {
      thisMonth: money(byMonth[thisMonth] ?? 0),
      next6: money(next6),
      allTime: money(allTime),
      byMonth: months.map((m) => ({ month: m, amount: byMonth[m] })),
      perSpace: Object.entries(perSpace).map(([spaceId, amount]) => ({ spaceId, title: db.spaces.find((s) => s.id === spaceId)?.title, amount }))
        .sort((a, b) => b.amount - a.amount),
    },
    listingCount: spaces.length,
    unitsListed: spaces.reduce((s, x) => s + (x.quantity ?? 1), 0),
  };
}

// Free units per day for `days` days starting at `from` (YYYY-MM-DD).
function calendar(db, spaceId, from, days = 42) {
  const space = db.spaces.find((s) => s.id === spaceId);
  if (!space) throw new Error('Space not found');
  const out = [];
  for (let i = 0, t = toMs(from); i < Math.min(days, 400); i++, t += DAY) {
    const date = new Date(t).toISOString().slice(0, 10);
    out.push({ date, free: unitsFree(db, space, t, t + DAY), total: space.quantity ?? 1 });
  }
  return out;
}

__m['host'] = { payoutSchedule, hostSummary, calendar };
})();

const SPEC_HTML = "<h1 id=\"everyspace-product-spec-working-name\">Everyspace: product spec (working name)<\/h1>\n<p>Everyspace is a marketplace for renting out <strong>any part of a property<\/strong> for <strong>any length of time<\/strong>. You could rent out a backyard for one night, a driveway spot for fair weekend, a garage corner for a month, a whole house like a vacation rental, a front yard for a garden, or a roof for 20 years to someone who pays for solar panels on it.<\/p>\n<p>It also handles <strong>multi-unit buildings<\/strong>. A renter can take just an apartment, or an apartment plus two parking spaces and a storage locker, under rules the owner sets.<\/p>\n<p>This document covers what can be rented and how renting works. It comes before the build. The prototype in <code>src/<\/code> implements the core rules described here.<\/p>\n<hr>\n<h2 id=\"1-what-can-be-rented\">1. What can be rented<\/h2>\n<p>Every listing is a <strong>space<\/strong>, and every space has a <strong>category<\/strong>. The category sets which rental lengths are allowed, how the space is measured and priced, the default booking mode, and the checklist a host has to complete before going live.<\/p>\n<p>Rental lengths (terms):<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Term<\/th><th>Unit<\/th><th>Typical use<\/th><\/tr><\/thead><tbody><tr><td>Hourly<\/td><td>hour<\/td><td>Backyard party, pool, studio session, EV charging<\/td><\/tr><tr><td>Nightly / daily<\/td><td>day<\/td><td>Vacation stay, event-day parking, overnight camping<\/td><\/tr><tr><td>Weekly<\/td><td>week<\/td><td>Longer stay, temporary storage<\/td><\/tr><tr><td>Month-to-month<\/td><td>month<\/td><td>Parking, storage, garden plot, room<\/td><\/tr><tr><td>Fixed lease<\/td><td>month, 6–24 mo<\/td><td>Apartment, ADU, long-term parking<\/td><\/tr><tr><td>Infrastructure agreement<\/td><td>year, 5–25 yr<\/td><td>Rooftop solar, battery, charger, antenna<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"catalog\">Catalog<\/h3>\n<p><strong>Living<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Entire home<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td>Works like Airbnb. Needs a short-term-rental permit and occupancy tax where the city requires them.<\/td><\/tr><tr><td>Apartment / unit<\/td><td>daily, monthly, lease<\/td><td>whole<\/td><td>A unit in a multi-unit building. It can anchor add-ons (§3).<\/td><\/tr><tr><td>ADU / guest house<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td><\/td><\/tr><tr><td>Private room<\/td><td>daily, weekly, monthly, lease<\/td><td>whole<\/td><td>Shared common areas are listed in the house rules.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Outdoor and activity<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Backyard<\/td><td>hourly, daily<\/td><td>whole<\/td><td>Parties, gatherings, dog play, photo shoots. Noise curfew and guest cap are required.<\/td><\/tr><tr><td>Yard campsite<\/td><td>daily, weekly<\/td><td>site<\/td><td>Tent or small RV overnight. Requires restroom access.<\/td><\/tr><tr><td>Pool<\/td><td>hourly<\/td><td>whole<\/td><td>Lifeguard and waiver rules. Host must confirm insurance.<\/td><\/tr><tr><td>Workspace / studio / workshop<\/td><td>hourly, daily, monthly<\/td><td>whole<\/td><td>Home office, music room, wood shop.<\/td><\/tr><tr><td>Filming / photo location<\/td><td>hourly, daily<\/td><td>whole<\/td><td>Always request-to-book. City film permit may be needed.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Parking<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Parking spot<\/td><td>hourly, daily, weekly, monthly, lease<\/td><td>spot (quantity)<\/td><td>Driveway, garage, or carport. <strong>Event pricing<\/strong> covers fair, stadium, and parade days.<\/td><\/tr><tr><td>RV / boat / trailer parking<\/td><td>weekly, monthly, lease<\/td><td>spot<\/td><td>Length limit and HOA check.<\/td><\/tr><tr><td>EV charging<\/td><td>hourly, daily, monthly<\/td><td>charger<\/td><td>Host's own charger. Price covers time and electricity.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Storage<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Garage storage<\/td><td>weekly, monthly, lease<\/td><td>sq ft (quantity of bays)<\/td><td>Hazardous materials are not allowed. Host sets access hours.<\/td><\/tr><tr><td>Attic storage<\/td><td>monthly, lease<\/td><td>sq ft<\/td><td>Weight limit and ladder access must be disclosed.<\/td><\/tr><tr><td>Basement / closet / shed<\/td><td>weekly, monthly, lease<\/td><td>sq ft<\/td><td><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Land and growing<\/strong><\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Garden plot<\/td><td>monthly, lease<\/td><td>sq ft (quantity of plots)<\/td><td>Front or back yard. Water access, HOA front-yard rules, and chemical policy.<\/td><\/tr><tr><td>Beehive / small-ag site<\/td><td>monthly, lease<\/td><td>site<\/td><td>Local apiary rules apply.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Energy and infrastructure.<\/strong> These spaces are rented to companies, not people, through long agreements.<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Category<\/th><th>Terms<\/th><th>Measured by<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Rooftop solar<\/td><td>infrastructure, 10–25 yr<\/td><td>sq ft of roof<\/td><td>A third party pays for, owns, and maintains the panels and pays the owner rent or a share of the power. Requires a roof-age and structural check, utility interconnection (net metering, community solar, or virtual net metering), a removal and re-roof clause, and a recorded lease or easement.<\/td><\/tr><tr><td>Battery site<\/td><td>infrastructure, 5–20 yr<\/td><td>site<\/td><td>Garage wall, side yard, or pad. Requires fire code setbacks (NFPA 855), a utility or virtual-power-plant program, and permits.<\/td><\/tr><tr><td>Public EV charger site<\/td><td>infrastructure, 5–15 yr<\/td><td>site<\/td><td>A third party installs a charger in a driveway or curb cut.<\/td><\/tr><tr><td>Telecom / sensor site<\/td><td>infrastructure, 5–25 yr<\/td><td>site<\/td><td>Small-cell antenna, mesh node, or weather station.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Later:<\/strong> signage and billboards (heavily regulated), dock or slip space, horse paddock, and laundry or kitchen time.<\/p>\n<p><strong>Not allowed:<\/strong> public streets and curbs, shared HOA common areas the host doesn't control, and any space whose required permit the host can't show.<\/p>\n<hr>\n<h2 id=\"2-how-it-works\">2. How it works<\/h2>\n<h3 id=\"properties-and-spaces\">Properties and spaces<\/h3>\n<pre><code>Host ─┬─ Property (address, type, rules, HOA y/n, insurance)\n      └─ Space (category, quantity, rates per term, availability, parent?)\n            └─ Space (child) ...<\/code><\/pre>\n<ul><li><strong>Quantity.<\/strong> One listing can stand for several identical units, such as 4 driveway spots, 3 garage bays, or 8 storage lockers. Bookings use up quantity, and the listing stays available until all units are taken.<\/li><li><strong>Hierarchy (parent/child).<\/strong> A space can sit inside another one. For example, a garage bay is inside the garage, a room is inside the house, and an apartment is inside the building.<ul><li>Booking a parent blocks all of its children. If the whole house is booked, its rooms and backyard are not.<\/li><li>Booking any child blocks the parent as a whole. Rooms 1 and 2 can be rented separately, but then the whole house can't be.<\/li><li>Structural containers such as a building or a garage can be marked <strong>not rentable<\/strong>. They organize the listing and never block anything.<\/li><\/ul><\/li><li><strong>Explicit conflicts.<\/strong> Some spaces overlap without one sitting inside the other, such as \"driveway parking\" and \"RV parking\" in the same driveway. A host can mark them as conflicting.<\/li><li><strong>Independent spaces.<\/strong> A roof leased for solar does not conflict with the house being rented nightly. It isn't a child of the house, so the two never block each other.<\/li><\/ul>\n<h3 id=\"pricing\">Pricing<\/h3>\n<ul><li>There is one rate per allowed term, such as $12/hour, $45/day, or $180/month. Weekly stays use the weekly rate plus extra days at the daily rate. Partial months are prorated at the monthly rate divided by 30.<\/li><li><strong>Event pricing.<\/strong> Hosts can set date-range overrides, for example \"County Fair, Aug 14–17, $40/day\" for a driveway spot. When a booking covers those dates, the override replaces the daily rate for those days.<\/li><li><strong>Add-on price.<\/strong> A space can cost less when it is attached to an anchor rental (§3).<\/li><li><strong>Packages<\/strong> have their own price, either a fixed amount per period or a % discount (§3).<\/li><li><strong>Fees (prototype values).<\/strong> Renters pay a 10% service fee, and hosts pay 3%. Long and infrastructure agreements are charged per period rather than all at once.<\/li><li><strong>Deposits<\/strong> are set by category, such as a whole home or storage, and are held, not charged.<\/li><\/ul>\n<h3 id=\"booking-modes\">Booking modes<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>Mode<\/th><th>When<\/th><th>Flow<\/th><\/tr><\/thead><tbody><tr><td>Instant<\/td><td>Short, low-risk rentals: parking, storage, hourly yard<\/td><td>Pay, then <strong>confirmed<\/strong><\/td><\/tr><tr><td>Request<\/td><td>Whole homes, filming, leases, anything the host flags<\/td><td><strong>pending<\/strong> (dates held 24h), then host approves (<strong>confirmed<\/strong>) or declines<\/td><\/tr><tr><td>Proposal<\/td><td>Infrastructure agreements<\/td><td><strong>proposed<\/strong>, then <strong>site assessment<\/strong>, then <strong>contract<\/strong>, then <strong>confirmed<\/strong>. Rent starts when the system is commissioned.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>A cart with several items uses its strictest mode. For example, instant parking plus a request-to-book apartment becomes a request.<\/p>\n<p>States: <code>pending | proposed | site_assessment | contract | confirmed | active | completed | declined | cancelled<\/code>. Pending and proposal-stage bookings hold the space, so nobody can double-book while the host decides.<\/p>\n<h3 id=\"payments-schedule\">Payments schedule<\/h3>\n<ul><li><strong>Hourly, daily, or weekly:<\/strong> the full amount is charged at booking. The host is paid out 24h after check-in.<\/li><li><strong>Month-to-month or lease:<\/strong> the first period plus the deposit is charged at booking, then autopay each period. Month-to-month ends with 30 days' notice.<\/li><li><strong>Infrastructure:<\/strong> annual (or monthly) rent paid by the company. The platform takes its fee on each payment.<\/li><\/ul>\n<h3 id=\"access-and-handoff\">Access and handoff<\/h3>\n<p>Each space has access instructions that are revealed after confirmation, such as a gate code, a lockbox, or a smart-lock code generated per booking. It also has access hours (storage 7am–9pm, for example) and a check-in/out photo log, which is used for disputes about storage contents and yard condition.<\/p>\n<hr>\n<h2 id=\"3-multi-unit-buildings-add-ons-and-packages\">3. Multi-unit buildings, add-ons, and packages<\/h2>\n<p>The owner of an apartment building lists the <strong>building<\/strong> as a non-rentable container. Inside it go the <strong>units<\/strong>, a <strong>parking pool<\/strong> (for example 12 spots), a <strong>storage locker pool<\/strong>, and maybe EV chargers. The owner then decides how each one can be rented:<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>Rental policy<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td><code>standalone<\/code><\/td><td>Anyone can rent it alone<\/td><td>Apartment 2A, EV charger by the hour<\/td><\/tr><tr><td><code>addon<\/code><\/td><td>Can be rented only with an anchor<\/td><td>Garage parking only for building tenants<\/td><\/tr><tr><td><code>both<\/code><\/td><td>Rentable alone, with a lower price as an add-on<\/td><td>Storage locker: $90/mo alone or $60/mo with a unit<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Add-on rules<\/strong> are set on the add-on space:<\/p>\n<ul><li><code>anchors<\/code>: which spaces can carry this add-on, such as \"any unit in this building\" (by category) or specific unit IDs.<\/li><li><code>maxPerAnchor<\/code>: the most of this add-on one anchor can carry, such as 2 parking spaces per apartment.<\/li><li>The anchor can be in the <strong>same cart<\/strong> or be an <strong>existing booking<\/strong> of the same renter that covers the whole add-on period. A tenant who signed a lease in March can add a second parking spot in June.<\/li><li>The add-on can't outlast the anchor. If the lease ends, the add-on has to end with it.<\/li><\/ul>\n<p><strong>Packages<\/strong> are bundles defined by the host, like \"Unit 1A + 2 parking\" at $2,650/mo fixed or \"Any unit + locker\" at 10% off. A package is listed as one item in search results. When booked, it becomes the underlying spaces, so availability and conflicts are still checked for each space.<\/p>\n<p>That gives a renter these choices:<\/p>\n<ol><li>Apartment only.<\/li><li>Apartment plus 1 or 2 parking spaces (add-ons, capped at 2).<\/li><li>A package, such as Apartment 1A plus 2 parking at a fixed price.<\/li><li>Later, add a locker to their existing lease.<\/li><li>A non-tenant can rent a locker alone at the standalone price, but cannot rent parking, which is add-on only.<\/li><\/ol>\n<p>The same model works for a single house. For example, an owner can rent the ADU and offer the driveway spot only to whoever rents the ADU.<\/p>\n<hr>\n<h2 id=\"4-trust-safety-and-legal\">4. Trust, safety, and legal<\/h2>\n<ul><li><strong>Host checklist per category<\/strong> must be complete before a listing goes live: permits, HOA approval, insurance, and safety items such as smoke/CO detectors, pool fencing, NFPA 855, and roof assessment.<\/li><li><strong>Identity verification<\/strong> is required for both sides. Leases and infrastructure agreements also need a business or credit check.<\/li><li><strong>Agreements.<\/strong> Short rentals use platform terms of service. Leases use a state-specific lease template. Infrastructure uses a recorded lease or easement with removal, insurance, and indemnity clauses.<\/li><li><strong>Insurance.<\/strong> A host protection policy for short rentals. Infrastructure partners must name the owner as additional insured.<\/li><li><strong>Reviews<\/strong> in both directions, plus disputes backed by the check-in/out photos.<\/li><li><strong>Local rules engine (later).<\/strong> Look up the address to see short-term-rental caps, parking ordinances, and garden and front-yard rules, then turn off terms that aren't allowed.<\/li><\/ul>\n<hr>\n<h2 id=\"5-build-plan\">5. Build plan<\/h2>\n<div class=\"table-wrap\"><table><thead><tr><th>Phase<\/th><th>Scope<\/th><\/tr><\/thead><tbody><tr><td><strong>0: rules prototype (done)<\/strong><\/td><td>Catalog, data model, availability with quantity, hierarchy, and conflicts, add-on and package rules, pricing with event rates, booking modes and states, JSON API, tests<\/td><\/tr><tr><td><strong>0.5: app prototype (done)<\/strong><\/td><td>Installable mobile-first app. Renters: explore with map, events and bundles, listing pages with availability calendar and reviews, checkout for every rental length, trips with access details, messaging, reviews. Hosts: today dashboard, approve or decline in chat, listings tree, earnings by month, step-by-step listing wizard with the required checklist. Works offline as a single HTML file.<\/td><\/tr><tr><td>1: MVP<\/td><td>Real auth, Postgres, Stripe Connect payouts, photo uploads, map search, messaging, notifications<\/td><\/tr><tr><td>2: Trust<\/td><td>ID verification, reviews, check-in/out photo log, disputes, insurance partner<\/td><\/tr><tr><td>3: Long-term<\/td><td>Lease templates and e-sign, autopay, move-in/out, maintenance requests<\/td><\/tr><tr><td>4: Infrastructure marketplace<\/td><td>Solar, battery, and charger partner portal, roof and site assessment scheduling, rent from commissioning, revenue share<\/td><\/tr><tr><td>5: Local rules engine<\/td><td>Permit and ordinance lookup by address, automatic term limits<\/td><\/tr><\/tbody><\/table><\/div>";
const KEY = 'everyspace-demo-v2';
let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!db) db = seed();
const store = {
  get db() { return db; },
  newId: (prefix) => `${prefix}_${db.seq++}`,
  save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} },
  reset() { db = seed(); this.save(); },
};
window.everyspaceApi = async (path, body) => {
  const [p, qs] = path.split('?');
  try {
    return JSON.parse(JSON.stringify(handleApi(store, body ? 'POST' : 'GET', p, body ?? {}, new URLSearchParams(qs), { spec: () => SPEC_HTML })));
  } catch (err) {
    if (!isUserError(err) && !(err instanceof NotFound)) console.error(err);
    const e = new Error(err.message); e.details = err.details ?? []; throw e;
  }
};
})();
</script>
<script type="module">
(() => {
const __m = {};
// ---- public/js/core.js ----
(() => {
// Shared helpers: API access, app state, formatting, icons, sheets and toasts.

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `$${Number(n ?? 0).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 })}`;

async function api(path, body) {
  if (window.everyspaceApi) return window.everyspaceApi(path, body); // single-file build: API runs in the page
  const res = await fetch(`/api/${path}`, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) { const e = new Error(data.error); e.details = data.details; throw e; }
  return data;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(`everyspace:${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(`everyspace:${k}`, JSON.stringify(v)); } catch { /* private mode */ } },
};

const state = {
  catalog: null,
  users: [],
  user: store.get('user', 'u_sam'),
  mode: store.get('mode', 'guest'), // 'guest' | 'host'
  filters: { group: '', category: '', term: '', start: '', end: '', q: '' },
  view: 'list',
  get me() { return this.users.find((u) => u.id === this.user) ?? this.users[0]; },
  setUser(id) { this.user = id; store.set('user', id); },
  setMode(m) { this.mode = m; store.set('mode', m); },
};

const cat = (key) => state.catalog.categories[key];
const term = (key) => state.catalog.terms[key];
const TERM_ORDER = ['hourly', 'daily', 'weekly', 'monthly', 'lease', 'infrastructure'];
const TERM_SHORT = { hourly: 'Hourly', daily: 'Nightly', weekly: 'Weekly', monthly: 'Monthly', lease: 'Lease', infrastructure: 'Long-term deal' };

function cheapestRate(s) {
  const t = TERM_ORDER.find((k) => s.rates?.[k] != null) ?? TERM_ORDER.find((k) => s.addonRates?.[k] != null);
  return t ? { term: t, amount: s.rates?.[t] ?? s.addonRates[t], unit: term(t).unit } : null;
}
const priceTag = (r) => (r ? `${money(r.amount)}<span>/${r.unit === 'day' ? 'night' : r.unit}</span>` : '');

// ---------- dates (UTC, YYYY-MM-DD) ----------
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const t = new Date(`${d}T00:00:00Z`); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
function addMonths(d, n) {
  const t = new Date(`${d}T00:00:00Z`);
  const day = t.getUTCDate();
  t.setUTCDate(1); t.setUTCMonth(t.getUTCMonth() + n);
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return t.toISOString().slice(0, 10);
}
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(iso, { year = false } = {}) {
  const d = new Date(iso.length <= 10 ? `${iso}T00:00:00Z` : iso);
  return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}${year ? `, ${d.getUTCFullYear()}` : ''}`;
}
function fmtTime(iso) {
  const d = new Date(iso); const h = d.getUTCHours(); const m = d.getUTCMinutes();
  return `${h % 12 || 12}${m ? `:${String(m).padStart(2, '0')}` : ''}${h < 12 ? 'am' : 'pm'}`;
}
function fmtRange(b) {
  if (b.term === 'hourly') return `${fmtDate(b.start)}, ${fmtTime(b.start)}–${fmtTime(b.end)}`;
  const crossYear = b.start.slice(0, 4) !== b.end.slice(0, 4);
  return `${fmtDate(b.start, { year: crossYear })} → ${fmtDate(b.end, { year: true })}`;
}
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}d`;
  return fmtDate(iso);
}

// ---------- small components ----------
const avatar = (u, size = 36) => `<span class="avatar" style="--size:${size}px;background:${esc(u?.color ?? '#888')}">${esc((u?.name ?? '?')[0])}</span>`;
const stars = (r) => (r?.count ? `<span class="stars">★ ${r.avg.toFixed(1)} <span class="muted">(${r.count})</span></span>` : '<span class="stars new">New</span>');

const STATUS = {
  pending: ['Awaiting host', 'warn'], proposed: ['Proposal sent', 'warn'], site_assessment: ['Site assessment', 'warn'],
  contract: ['Contract out', 'warn'], confirmed: ['Confirmed', 'ok'], active: ['Happening now', 'ok'],
  completed: ['Completed', ''], declined: ['Declined', 'bad'], cancelled: ['Cancelled', 'bad'],
};
const statusPill = (s) => `<span class="pill ${STATUS[s]?.[1] ?? ''}">${STATUS[s]?.[0] ?? esc(s)}</span>`;

const errorBox = (e) => `<div class="error">${esc(e.message)}${e.details?.length ? `<ul>${e.details.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}</div>`;

const icon = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  explore: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
  trips: '<svg viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V5.5a1.5 1.5 0 011.5-1.5h3A1.5 1.5 0 0115 5.5v2"/></svg>',
  inbox: '<svg viewBox="0 0 24 24"><path d="M4 5.5h16v10H9l-5 4z"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>',
  today: '<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
